<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selvaaador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0507, #3b0d13, #120204);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            width: 88%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 2px rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .profile-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .link-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        .app-icon {
            width: 36px;
            height: 36px;
            margin-right: 15px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        .link-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .app-name {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .username {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>

    <div class="glass-card">
        <h1 class="profile-title">SELVADOR</h1>

        <div class="links-container">
            <!-- TikTok -->
            <a href="https://www.tiktok.com" target="_blank" class="link-item">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" class="app-icon" alt="TikTok">
                <div class="link-text">
                    <span class="app-name">TikTok</span>
                    <span class="username">@tiktok_handle</span>
                </div>
            </a>

            <!-- Discord -->
            <a href="https://discord.com" target="_blank" class="link-item">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" class="app-icon" alt="Discord">
                <div class="link-text">
                    <span class="app-name">Discord</span>
                    <span class="username">selvaaador</span>
                </div>
            </a>

            <!-- Roblox -->
            <a href="https://www.roblox.com" target="_blank" class="link-item">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670321.png" class="app-icon" alt="Roblox">
                <div class="link-text">
                    <span class="app-name">Roblox</span>
                    <span class="username">roblox_username</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 70 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2.5 + 1,
            speed: Math.random() * 1.2 + 0.4,
            opacity: Math.random() * 0.7 + 0.3
        }));

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(235, 70, 70, ${p.opacity})`;
                ctx.fill();

                p.y += p.speed;
                if (p.y > canvas.height) {
                    p.y = -5;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();
    </script>
</body>
</html>
