<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT INFO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Creepster&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #1f0306 0%, #030001 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* ----- دخالـة الدخان والأحمر (Smoke & Red Storm Intro) ----- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            overflow: hidden;
            animation: fadeOutIntro 0.6s ease-out 2.8s forwards;
        }

        /* تأثير الدخان السريع */
        .smoke-overlay {
            position: absolute;
            width: 250%;
            height: 250%;
            background: radial-gradient(circle, rgba(235, 20, 45, 0.4) 0%, rgba(10, 0, 2, 0.95) 70%);
            filter: blur(50px);
            animation: smokeMove 2.5s ease-in-out infinite alternate;
        }

        @keyframes smokeMove {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.3) rotate(15deg); opacity: 0.9; }
        }

        /* فلاش الرعد الأحمر */
        .red-flash {
            position: absolute;
            inset: 0;
            background: #ff002b;
            opacity: 0;
            animation: flashStrike 2.5s ease-in-out forwards;
        }

        @keyframes flashStrike {
            0% { opacity: 0; }
            10% { opacity: 0.85; }
            15% { opacity: 0.1; }
            25% { opacity: 0.95; }
            35% { opacity: 0.2; }
            60% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* كلمة SELVADOR بستايل الجروح والدمخاش (Scratch / Wounded Text) */
        .wounded-title {
            position: relative;
            z-index: 10001;
            font-family: 'Creepster', cursive, 'Cinzel', serif;
            font-size: 58px;
            color: #ff1a3c;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 
                0 0 10px #ff002b,
                0 0 20px #ff002b,
                2px 2px 0px #000,
                -2px -2px 0px #500;
            animation: textScratched 2.5s ease-in-out forwards;
            user-select: none;
        }

        /* تأثير تشقق وجروح الكلمة */
        @keyframes textScratched {
            0% {
                opacity: 0;
                transform: scale(0.6) translateY(30px);
                filter: blur(12px) contrast(200%);
            }
            20% {
                opacity: 1;
                transform: scale(1.1) translateY(0);
                filter: blur(0px) contrast(150%);
            }
            30% { transform: scale(0.98) rotate(-2deg); }
            40% { transform: scale(1.02) rotate(2deg); }
            80% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.2);
                filter: blur(15px);
            }
        }

        @keyframes fadeOutIntro {
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* الثلج في أعلى طبقة */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* أنيميشن ظهور الواجهة الرئيسية */
        @keyframes entranceEffect {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.94);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 32px;
            padding: 35px 22px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85),
                        inset 0 1px 0 rgba(255, 255, 255, 0.12);
            text-align: center;
            opacity: 0;
            animation: entranceEffect 1s cubic-bezier(0.16, 1, 0.3, 1) 2.7s forwards;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 28px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .glass-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 22px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: entranceEffect 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-card:nth-child(1) { animation-delay: 2.85s; }
        .glass-card:nth-child(2) { animation-delay: 2.95s; }
        .glass-card:nth-child(3) { animation-delay: 3.05s; }
        .glass-card:nth-child(4) { animation-delay: 3.15s; }
        .glass-card:nth-child(5) { animation-delay: 3.25s; }
        .glass-card:nth-child(6) { animation-delay: 3.35s; }

        .glass-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .icon-box {
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
        }

        .icon-box svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6))
                    drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.9));
        }

        .text-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .app-name {
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .username {
            color: rgba(255, 255, 255, 0.55);
            font-size: 12.5px;
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
    </style>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 85;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.2 + 0.8,
                speedY: Math.random() * 0.9 + 0.35,
                speedX: Math.random() * 0.4 - 0.2,
                opacity: Math.random() * 0.65 + 0.25
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(225, 45, 55, ${p.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(225, 45, 55, 0.85)';
                ctx.fill();

                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y > canvas.height) {
                    p.y = -5;
                    p.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(drawSnow);
        }

        drawSnow();
    </script>
